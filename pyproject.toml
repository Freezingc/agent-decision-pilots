[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-decision-pilots"
version = "0.1.0"
description = "Exploratory feasibility probes for agent decision algorithms"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
generation = ["torch==2.10.0", "transformers==5.13.0", "accelerate==1.14.0"]
evaluation = ["evalplus==0.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
